# 
# cargo-features = ["codegen-backend"]
# [profile.dev]
# codegen-backend = "cranelift"


[package]
name = "mubbles"
version = "2.3.0"
authors = ["Jonathan Newnham"]
edition = "2021"
rust-version = "1.81"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = "0.33.2"
egui_extras = "0.33.2"
eframe = { version = "0.33.2", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features)
] }
log = "0.4.28"

# You only need serde if you want app persistence:
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

cpal = "0.16.0"
rubato = "0.16.2"
dirs = "6.0.0"
rolling-file = "0.2.0"
tracing = "0.1.41"
tracing-appender = "0.2.3"
chrono = { version = "0.4.42", features = ["serde"] }
egui_plot = "0.34.0"
open = "5.3.2"
reqwest = { version = "0.12.24", features = ["json", "blocking"] }
anyhow = "1.0.100"
byteorder = "1.5.0"

candle-core = { version = "0.9.1", features = [], optional = true }
candle-transformers = { version = "0.9.1", features = [], optional = true }
candle-nn = { version = "0.9.1", features = [], optional = true }

hf-hub = { version = "0.4.3", default-features = false, features = [
    "ureq",
    "rustls-tls",
] }
rand = "0.9.2"
tokenizers = "0.22.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "std"] }
rustfft = "6.4.1"
#ort = { version = "1.16.3", features = [] }
hound = "3.5.1"
symphonia = { version = "0.5.3", features = ["all"] }
bitcode = "0.6.7"
rfd = "0.15.4"
shellexpand = "3"

[features]
default = ["candle-core", "candle-transformers", "candle-nn"]
cuda = [
    "candle-core/cuda",
    "candle-transformers/cuda",
    "candle-nn/cuda",
    #    "ort/cuda"
]
mkl = ["candle-core/mkl", "candle-transformers/mkl", "candle-nn/mkl"]

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# linux:
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.8", features = ["v0_3_44"] }
libspa = "0.8"

# windows:
[target.'cfg(windows)'.dependencies]
winput = "0.2.5"
wasapi = "0.19.0"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.55"
web-sys = "0.3.82"              # to access the DOM (to hide the loading text)

[profile.release]
opt-level = 2 # fast and small wasm
debug = false # faster, smaller builds

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2


# Override crates.io to use local submodule
[patch.crates-io]
candle-core = { path = "candle/candle-core" }
candle-nn = { path = "candle/candle-nn" }
candle-transformers = { path = "candle/candle-transformers" }
